; ============================================================================
;  Bloody Mess 0.1.1 - by spitmux
;
;  More blood out of people, blood that stays on the world, and footprints out
;  of the puddles.
;
;  Every system here can be switched off on its own, and every number has a
;  working default in the dll -- deleting a line falls back to that default
;  rather than breaking anything. The same settings are on the in-game menu
;  (F10 by default), which writes changes back to this file without disturbing
;  these comments.
;
;  IF THE GAME STARTS DROPPING DECALS OR STUTTERING IN LONG FIGHTS, the
;  settings to look at are in [Budget] at the bottom. That section is the
;  safety on the whole mod and the one thing worth understanding before
;  turning anything else up.
; ============================================================================


[General]

Enabled=true

; A ticker message on load, naming the menu key.
AnnounceOnLoad=true

; Error, Warn, Info or Debug. Debug is loud; use it when something is not
; happening and you want to know why.
LogLevel=Info

; The settings menu. F10 is free on both installs; F2 is Hoodrich, F3 is
; Overspray, F4 is the native trainer and cannot be moved, F6 is ENT, F7 is
; Bare Minimum, F8 is the Dealien menu. Accepts a key name or a hex code.
MenuKey=F10

; Controller support for the menu.
;
; HOLD the View/Back button (the player-list button, which does nothing in
; single player) to open and close it. Then d-pad to move, A to change a
; setting or fire an action, B to close. Held rather than tapped so it cannot
; open by accident mid-firefight.
ControllerMenu=true
ControllerHoldMs=350


[Intensity]

; The one setting most people want. Tame, Bloody, Mess or Abattoir.
;
;   Tame      barely above stock
;   Bloody    visibly bloodier, sane sizes
;   Mess      what the mod is named for
;   Abattoir  silly. Watch [Budget].
;
; This scales how MUCH blood there is -- counts and sizes. It deliberately
; does not touch [Budget], so turning the gore up cannot turn the safety off.
Level=Mess

; Fine trim on top of the level, for when a level is nearly right. 0.1 to 5.
Multiplier=1.0


; ---------------------------------------------------------------------------
;  Blood ON the body: wounds, torn clothing, the burst at the point of impact.
;  Costs nothing from the world decal pool.
; ---------------------------------------------------------------------------
[Wounds]

Enabled=true

; Extra wound decals stamped per hit, on top of the one the game already does.
; This is what makes a burst of fire look like a burst rather than one hole.
PerHit=1

; Size of those wounds. 1.0 is the game's own.
Scale=1.1

; Apply the game's pre-authored damage packs on a kill -- matching wounds and
; torn clothing, made by hand rather than scattered. Which pack each weapon
; uses is in BloodyMess\gore.json.
DamagePacks=true

; Whether the player bleeds like everyone else, and gets splattered when they
; kill somebody at arm's length.
PlayerWounds=true


; ---------------------------------------------------------------------------
;  Blood that LEAVES the body and lands on the world. The main event, and the
;  main consumer of the decal budget.
; ---------------------------------------------------------------------------
[Spray]

Enabled=true

; Splatter decals thrown per hit, before the level scales it. Damage scales it
; too, so a graze stays a graze.
PerHit=2

; Splatters dropped straight down around the victim on every hit, separate from
; the thrown spray above.
;
; The thrown spray follows the shot line and can land metres away; this is the
; blood that just falls out of the wound onto the floor where they are standing.
; It is what stops the ground under a body being clean. Set to 0 to turn it off.
GroundDrops=20

; How far behind the target the spray can reach, in metres.
;
; Drops are now weighted TOWARDS THE BODY across this range. Until 0.1.2 every
; ground splatter landed between half and full range, so nothing ever landed
; near the victim -- you would shoot someone, look down, and see clean ground
; while the blood sat three metres behind you.
Range=4.5

; How wide the cone is. 0 is a line, 1 is a wide fan.
Spread=0.45

; Sizes in metres. These are SMALL on purpose and were cut hard in 0.1.1:
; 0.1.0 shipped 0.12-0.55 and then multiplied it by a damage factor that every
; kill pinned at its maximum, so a single death painted a two-metre splatter.
; Damage still scales these; the gore level no longer does.
MinSize=0.10
MaxSize=0.32
Opacity=0.85

; Let spray land on walls, not just the ground. Turning this off roughly
; halves what the mod costs, and loses most of what it is for.
OnWalls=true

; The fine mist over the top of a splatter, now drawn on the GROUND as well as
; on walls. It is the cheap part of this mod -- it reuses the ground already
; found for the splatter under it, so it costs no extra raycast -- and it is
; the part that reads best.
Mist=true

; How often a splatter gets a mist halo, 0 to 1.
MistChance=0.85

; Our OWN extra blood particle burst at the wound, on top of the game's.
;
; OFF. The game already throws its own blood particles on a hit; a second burst
; over the top is what made the spray look like far too much. The mist and the
; blood on the ground carry the mod now, and the airborne part stays vanilla.
Particles=false


; ---------------------------------------------------------------------------
;  The pool that spreads out from under a body. One decal per pool, however
;  big it gets -- growth is a redraw, not a stack.
; ---------------------------------------------------------------------------
[Pools]

Enabled=true

; Seconds after somebody goes down before a pool starts forming.
Delay=2.5

; Seconds from first appearing to fully grown.
GrowSeconds=30

; Metres across. NOT scaled by the gore level -- this is a measurement, and
; multiplying it by Mess in 0.1.0 made a 1.7m pool over three metres wide.
StartSize=0.35
MaxSize=1.7

; How many redraws it takes to get there. More is smoother and no more
; expensive; it just spends more of the per-second rate on the way.
Steps=6

; Whether badly wounded peds who are still alive pool as well as the dead.
FromWounded=true

; Draw OUR OWN pool under a body, instead of leaving it to the game.
;
; OFF, and the reason is that ours cannot look as good. GTA already grows a
; blood pool under a corpse using the good fxdecal_blood_pool artwork -
; textured, glossy, the right colour without help. The decal ids a script can
; reach either mix that artwork with a colourless flat one at random (so pools
; come out in two different shades) or are colourless every time (so they come
; out as a flat untextured blob whatever colour you tint them). Neither beats
; what the engine already does.
;
; With this off the mod adds no pool of its own, but it STILL marks the ground
; under a body as wet - which is all the footprints need, and it costs no
; decals at all.
;
; Turn it on if you want a bigger or differently coloured pool than the game's.
DrawOurOwn=false

; Use the game's varied blood-pool textures instead of the single plain one.
;
; OFF, because "varied" here means UNCONTROLLED. The blood pool decal has FOUR
; texture variants and the engine picks one at random - one colourless, three
; already dark red - so with a tint applied you get bright red pools sitting
; next to dark maroon ones, and no setting can bring them together. That is
; why pools were coming out in two different shades.
;
; Off, every pool uses one colourless texture and the tint alone decides the
; colour, so they all match. Turn it on if you would rather have the extra
; texture detail and can live with pools not matching each other.
VariedTextures=false


; ---------------------------------------------------------------------------
;  What a wounded ped leaves behind while still on their feet.
;
;  Drops are spaced by DISTANCE WALKED, and bleeding runs on a window that
;  expires. Standing still leaves nothing. Nobody bleeds forever.
; ---------------------------------------------------------------------------
[Drips]

Enabled=true

; Metres between drops.
Distance=1.1

Size=0.13
Opacity=0.7


; ---------------------------------------------------------------------------
;  Footprints out of the blood.
;
;  A foot that lands in wet blood picks some up; every stride afterwards
;  spends one print and fades, until it is walked off.
; ---------------------------------------------------------------------------
[Footprints]

Enabled=true

; Prints left after one walk through a puddle, before the level scales it.
Steps=14

; How close a foot has to get to wet blood to pick any up, in metres.
PickupRadius=1.1

; Metres of travel per print. Roughly one pace. Shorter means a denser trail
; and more decals spent on it.
Stride=0.62

Width=0.14
Length=0.33
Opacity=0.8

ForPlayer=true
ForNpcs=true

; How many NPCs may be tracked for prints at once. A gunfight in a crowd is
; when this mod is doing the most work and the game has the least to spare.
MaxNpcs=6

; How long blood stays wet enough to walk out of, in seconds. The decal itself
; never dries -- this only decides whether feet can still pick it up. Without
; a limit, a street where a fight happened an hour ago prints forever.
WetSeconds=150

; Also point the game's OWN footstep effect at its blood decal.
;
; Off by default, and deliberately. It is a global override on a shared system
; -- the same one that makes wet feet leave prints after swimming -- so it
; affects everybody, not just the ped it was set for. It is handed back the
; moment nobody is bloody-footed, but a mod that quietly holds a global is a
; mod other mods have to fight. Try it if you want the extra layer.
GameFootEffect=false


; ---------------------------------------------------------------------------
;  Heads coming off.
;
;  THIS IS THE ONLY DISMEMBERMENT GTA V SUPPORTS. The game has exactly one
;  native for it, EXPLODE_PED_HEAD, which removes the head and replaces it
;  with gore. There is no limb severing anywhere in the engine (that arrived
;  in RDR2), and no severed-head prop in the game files - so heads pop, they
;  do not fall off and roll away. Doing that would need a custom model, and
;  this mod ships no assets on purpose.
;
;  The chance is PER WEAPON and lives in BloodyMess\gore.json as headExplode:
;  sniper and heavy weapons 1.0, shotgun 0.9, rifle 0.45, pistol 0.25, melee
;  0.5, fists and taser 0. Chance below multiplies all of them at once.
; ---------------------------------------------------------------------------
[Heads]

; OFF. A head popping is a non-vanilla EVENT - it changes what a headshot is
; rather than making the existing one bloodier, and it brings a neck spurt with
; it that the stock game never shows. This mod is meant to be more of what GTA
; already does. Set to true if you want it; everything below still works.
Enabled=false

; Multiplies every weapon's own chance. 1.0 leaves them alone, 0.5 halves
; them, 0 is the same as switching this off.
Chance=1.0

; Health points a head hit must do before it can take the head off, so a
; graze does not.
MinDamage=25

; Whether it can happen to you too.
IncludePlayer=false

; The spurt from what is left of the neck afterwards.
NeckEffect=true


; ---------------------------------------------------------------------------
;  Tyres pick blood up out of a pool and lay it back down for a few metres.
; ---------------------------------------------------------------------------
[Wheels]

Enabled=true

Steps=10
Size=0.3
Opacity=0.7


; ---------------------------------------------------------------------------
;  THE SAFETY. Read this before turning the gore up.
;
;  The game has a fixed decal pool, and script decals compete with the game's
;  own bullet holes, tyre marks and scuffs for it. Going over it does not
;  crash and does not log anything: decals simply stop appearing, or the
;  engine starts recycling ones you wanted to keep. Both look like this mod
;  being broken rather than this mod being greedy.
;
;  These numbers are NOT scaled by [Intensity] on purpose.
;
;  On GTA V Enhanced the pool size is set by DecalPatch.ini (Level=4 is 2048)
;  -- with that, MaxSplatters can go a long way up. Legacy has no DecalPatch,
;  so its pool is whatever the game and your gameconfig give you, and the
;  defaults below are chosen to be survivable there.
; ---------------------------------------------------------------------------
[Budget]

; Live spray, drip, print and tyre-track decals at once. Oldest goes first.
;
; 500 ASSUMES A DECAL LIMIT PATCH. On this machine DecalPatch.ini has Level=4,
; and DecalPatch.log confirms it rewrote the game's pool from 256/512 to 2048
; slots -- so 500 is about a quarter of it, leaving the rest for the game's own
; bullet holes, tyre marks and scuffs.
;
; WITHOUT such a patch, drop this to about 140. Going over the engine's pool
; does not crash and does not log: decals simply stop appearing, or the game
; recycles ones you wanted to keep.
MaxSplatters=1000

; Live pools at once. A separate lane, so a long firefight cannot evict the
; pool under the first body -- which is what the footprints come from.
MaxPools=80

; New decals per second, however busy things get. This is what stops one
; shotgun blast into a crowd spending the whole pool in a single frame.
PerSecond=140

; Ground probes allowed per frame.
;
; THE FRAME-TIME SAFETY, and the counterpart to the decal budget above. Every
; ground splatter costs one shape test to find the surface under it. Placed all
; at once, a single kill could fire three dozen in a single tick - which does
; not error, it just spikes the frame. GTA's euphoria ragdolls are framerate
; sensitive, so the symptom is peds dying strangely rather than anything that
; looks like a decal problem.
;
; Six per frame spreads a whole kill's worth over about a quarter of a second.
; Raise it if blood appears too slowly, lower it if you see hitching.
ProbesPerFrame=10

; Nothing is drawn further than this from the camera, in metres. Also the
; range peds are watched over.
Range=65

; Lifetime handed straight to the game for each decal. Deliberately enormous:
; the native reference does not agree with itself about whether this is
; seconds or milliseconds, and 600000 outlasts a session either way. What
; actually decides when blood disappears is MaxSplatters above. Lower this
; only if you want blood to fade on a timer as well.
Timeout=600000


; ---------------------------------------------------------------------------
;  The engine's own gore switches. One native call each and no per-frame cost
;  -- on a weak machine, potentially the only part of this mod worth having.
; ---------------------------------------------------------------------------
[Game]

; The game's own blood particles, turned up. This is a switch, not a scale --
; the native takes a yes or no despite being named like a multiplier.
BiggerBloodParticles=false

; Bullet impact particle size, applied to every impact in the game.
BulletImpactScale=1.1

; How far away bullet impact decals still appear.
BulletImpactRange=2.0

; The spread of holes a shotgun leaves. Off makes a shotgun mark a wall like a
; pistol shot, so there is no good reason to turn this off.
ShotgunDecals=true

; Novelty. Confetti instead of blood.
ClownBlood=false

; Novelty. Green.
AlienBlood=false


; ---------------------------------------------------------------------------
;  What colour blood is.
;
;  THIS IS WHAT MAKES BLOOD RED INSTEAD OF WHITE. The game's splatter textures
;  (the fxdecal_splatter_mist family) are GREYSCALE MASKS -- the colour has to
;  be supplied by the script. 0.1.0 passed white through them, which is why
;  the blood came out looking like milk.
;
;  Values are 0..1 colour multipliers. Pools are deliberately left untinted,
;  because fxdecal_blood_pool is already properly coloured artwork.
;
;  Raise BloodRed towards 1 for brighter, more cartoonish blood. Raise green
;  and blue together to make it browner, like older blood.
; ---------------------------------------------------------------------------
[Appearance]

; Splatters, drips, footprints and tyre tracks. These textures are greyscale
; masks, so this IS the blood colour, not a filter over one.
;
; Kept DARK on purpose. A high BloodRed with near-zero green and blue gives a
; saturated scarlet that reads as paint; real blood is dark and slightly brown.
; Raise BloodRed towards 0.5 for fresher blood; raise green and blue together
; to make it browner, like older blood.
BloodRed=0.30
BloodGreen=0.025
BloodBlue=0.022

; Pools, tinted SEPARATELY from the splatters above, and they have to be.
;
; The game's pool decal (id 9001) has four texture variants: one colourless
; generic pool shared with water and oil, plus three proper blood textures.
; The engine picks one, so about one pool in four comes through the colourless
; one - and on grass or dirt (id 9006) the only variant IS colourless. That is
; what the bright scarlet oval was.
;
; A tint dark enough to make the colourless variant look like blood also
; crushes the three that are already dark red towards black, and a tint gentle
; enough to leave those alone turns the colourless one into a rug. No single
; value serves both, hence two.
;
; Lower these to darken pools; raise PoolRed if yours come out too black.
; Darker again now that every pool comes through one colourless texture: the
; tint is the whole colour, and 0.38 through a plain white pool is a bright
; pillar-box red. This sits about where the game's own blood pools sit.
; Only used when DrawOurOwn above is on. Brighter than the 0.24 that made our
; pools read as near-black holes beside the game's own; this is roughly where
; GTA's own pools sit.
PoolRed=0.5
PoolGreen=0.07
PoolBlue=0.06
